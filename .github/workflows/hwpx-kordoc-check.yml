name: HWPX Kordoc Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "skills/hwp-hwpx-processing/scripts/kordoc/**"
      - ".github/workflows/hwpx-kordoc-check.yml"
  push:
    branches:
      - main
    paths:
      - "skills/hwp-hwpx-processing/scripts/kordoc/**"
      - ".github/workflows/hwpx-kordoc-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: skills/hwp-hwpx-processing/scripts/kordoc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 의존성 설치 및 lockfile 생성
        run: npm install --omit=optional --ignore-scripts --no-audit --no-fund

      - name: Kordoc exact pin 확인
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import { VERSION } from 'kordoc'; const expected=JSON.parse(fs.readFileSync('package.json','utf8')).dependencies.kordoc; if (VERSION !== expected) { console.error('Kordoc version mismatch:', { expected, actual: VERSION }); process.exit(1); } console.log('Kordoc', VERSION);"

      - name: 문법 검사
        run: npm run check

      - name: 전체 테스트
        run: npm test

      - name: 보안 감사
        run: npm audit --omit=optional --audit-level=high

      - name: Chat runtime bundle 생성
        run: |
          rm -rf dist/chat-bundle
          mkdir -p dist/chat-bundle/hwpx-kordoc
          cp package.json package-lock.json README.md dist/chat-bundle/hwpx-kordoc/
          cp -R src node_modules dist/chat-bundle/hwpx-kordoc/
          cat > dist/chat-bundle/hwpx-kordoc/OFFLINE.md <<'EOF'
          # Offline Chat Runtime

          This bundle was produced by m1-starter HWPX Kordoc Check.
          Run with KORDOC_OFFLINE=1 and keep actual work documents outside this bundle.
          EOF

      - name: Chat runtime artifact 업로드
        uses: actions/upload-artifact@v4
        with:
          name: m1-starter-hwpx-kordoc-chat-linux-x64
          path: skills/hwp-hwpx-processing/scripts/kordoc/dist/chat-bundle/hwpx-kordoc
          retention-days: 1
          if-no-files-found: error
